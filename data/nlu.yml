# --------------------------------------------------
# BASIC CONVERSATION
# --------------------------------------------------

- intent: greet
  examples: |
    - hello
    - hi
    - hey
    - hi there
    - hello there
    - good morning
    - good afternoon
    - good evening
    - greetings
    - nice to meet you
    - hello eco travel assistant
    - hi travel planner
    - may I ask you something?
    - could you assist me today?

- intent: goodbye
  examples: |
    - goodbye
    - bye
    - see you later
    - thank you, goodbye
    - I do not need anything else
    - that will be everything
    - end this conversation
    - finish the chat
    - I am finished with the trip
    - we can stop here
    - I will come back later
    - no more help is needed
    - thanks, goodbye for now
    - close this conversation

- intent: affirm
  examples: |
    - yes
    - yes please
    - correct
    - that is correct
    - okay
    - sure
    - sounds good
    - exactly
    - confirm
    - confirm all details
    - accept these details
    - keep these details
    - save the updated value
    - I approve this change
    - everything looks accurate
    - continue with the current information

- intent: deny
  examples: |
    - no
    - no thanks
    - incorrect
    - that is wrong
    - not really
    - I do not want that
    - these details are not correct
    - something is wrong
    - I cannot confirm these details
    - the information is inaccurate
    - those details need correction
    - do not confirm this
    - this is not what I entered
    - I disagree with these details
    - review the information again
    - the summary contains a mistake


