version: "3.1"

rules:

- rule: Greet the user
  steps:
    - intent: greet
    - action: utter_greet

- rule: Say goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Start trip planning form
  steps:
    - intent: plan_trip
    - action: trip_form
    - active_loop: trip_form

- rule: User confirms selected trip plan
  steps:
    - intent: confirm_selected_plan
    - action: action_confirm_selected_plan

- rule: Review completed trip form
  condition:
    - active_loop: trip_form
  steps:
    - action: trip_form
    - active_loop: null
    - action: action_review_trip_details

- rule: Confirm all trip details
  condition:
    - slot_was_set:
        - awaiting_trip_confirmation: true
  steps:
    - intent: affirm
    - action: action_show_recommendations

- rule: Choose a trip detail to change
  condition:
    - slot_was_set:
        - awaiting_trip_confirmation: true
  steps:
    - intent: deny
    - action: action_choose_detail_to_change

- rule: Edit the selected trip detail
  steps:
    - intent: change_trip_detail
    - action: action_prepare_detail_change
    - action: trip_form
    - active_loop: trip_form

- rule: Confirm the changed detail
  condition:
    - slot_was_set:
        - awaiting_detail_confirmation: true
  steps:
    - intent: affirm
    - action: action_finish_detail_change

- rule: Re-enter the changed detail
  condition:
    - slot_was_set:
        - awaiting_detail_confirmation: true
  steps:
    - intent: deny
    - action: action_reenter_changed_detail

- rule: Cancel trip detail change while form is active
  condition:
    - active_loop: trip_form
  steps:
    - intent: cancel_change
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_cancel_detail_change

- rule: Cancel trip detail change outside form
  condition:
    - active_loop: null
  steps:
    - intent: cancel_change
    - action: action_cancel_detail_change

- rule: Show recommendations when requested
  steps:
    - intent: request_recommendations
    - action: action_show_recommendations

- rule: Select a transport recommendation
  steps:
    - intent: select_transport_option
    - action: action_select_transport_option

- rule: Choose whether to take the ferry
  steps:
    - intent: ferry_choice
    - action: action_show_recommendations

- rule: Human advisor handover
  steps:
    - intent: request_human_advisor
    - action: action_human_handover

- rule: Handle NLU fallback
  steps:
    - intent: nlu_fallback
    - action: action_default_fallback

- rule: Handle out of scope message
  steps:
    - intent: out_of_scope
    - action: action_default_fallback

- rule: User selects a hotel option
  steps:
    - intent: select_hotel_option
    - action: action_select_hotel_option
