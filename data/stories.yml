version: "3.1"

stories:

- story: Complete and confirm sustainable trip
  steps:
    - intent: plan_trip
    - action: trip_form
    - active_loop: trip_form
    - action: trip_form
    - active_loop: null
    - action: action_review_trip_details
    - slot_was_set:
        - awaiting_trip_confirmation: true
    - intent: affirm
    - action: action_show_recommendations

- story: User requests recommendations directly
  steps:
    - intent: request_recommendations
    - action: action_show_recommendations

- story: User requests human advisor
  steps:
    - intent: request_human_advisor
    - action: action_human_handover
